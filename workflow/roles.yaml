version: 0.2.0
authority:
  - AGENTS.md
  - docs/01-governance-and-safety/simulation-constitution-and-invariants.md
  - docs/06-delivery-and-operations/mvp-roadmap-and-definition-of-done.md
roles:
  - id: coordinator
    purpose: Select the next unblocked step, enforce ordering, and refuse an incomplete gate.
    instructions: workflow/roles/coordinator.md
    may_close_stage: false
  - id: scope
    purpose: Translate the roadmap stage into bounded objectives, dependencies, non-goals, risks, and stop conditions.
    instructions: workflow/roles/scope.md
    may_close_stage: false
  - id: traceability
    purpose: Map normative rules to requirement IDs, test IDs, risks, assumptions, contracts, and fixtures before implementation.
    instructions: workflow/roles/traceability.md
    may_close_stage: false
  - id: implementation
    purpose: Implement the smallest authoritative vertical slice without bypassing the Constitution.
    instructions: workflow/roles/implementation.md
    may_close_stage: false
  - id: contracts
    purpose: Keep schemas, valid and invalid fixtures, catalogues, and migrations aligned with runtime semantics.
    instructions: workflow/roles/contracts.md
    may_close_stage: false
  - id: verification
    purpose: Run invariant, contract, integration, replay, offline, security, performance, and full-pack checks.
    instructions: workflow/roles/verification.md
    may_close_stage: false
  - id: closeout
    purpose: Assemble gate evidence and release decision without changing failed results or claiming human approval.
    instructions: workflow/roles/closeout.md
    may_close_stage: true
