name: documentation-quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/stage_workflow.py validate
        env:
          PYTHONPATH: scripts
      - run: python scripts/validate_all.py
        env:
          PYTHONPATH: scripts
      - run: pytest -q
        env:
          PYTHONPATH: scripts
