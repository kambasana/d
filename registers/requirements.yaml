- id: AWG-REQ-INV-001
  title: 'No direct LLM state mutation'
  statement: 'An LLM MUST NOT directly write authoritative positions, ownership, resources, event truth, physical state, or completed actions.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-001
  status: draft
- id: AWG-REQ-INV-002
  title: 'No unexplained physical relocation'
  statement: 'After scenario initialization, every position change MUST require valid movement, transport, or an explicit logged intervention with authority and reason.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-002
  status: draft
- id: AWG-REQ-INV-003
  title: 'Time is causal'
  statement: 'Travel, actions, queues, communication, work, sleep, and other processes MUST consume simulation time according to their rules.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-003
  status: draft
- id: AWG-REQ-INV-004
  title: 'Geography constrains behavior'
  statement: 'Routes, barriers, entrances, access rights, modes, capacities, and topology MUST constrain movement.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-004
  status: draft
- id: AWG-REQ-INV-005
  title: 'Information requires a path'
  statement: 'An agent MUST only know information through direct perception, communication, accessible records or media, prior memory, or explicit inference from available evidence.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-005
  status: draft
- id: AWG-REQ-INV-006
  title: 'Truth and belief are separate'
  statement: 'World truth and agent belief MUST remain separate data. Agents MAY hold uncertain, incorrect, manipulated, or contradictory beliefs.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-006
  status: draft
- id: AWG-REQ-INV-007
  title: 'Social actions do not imply belief'
  statement: 'Viewing, understanding, believing, endorsing, liking, commenting, reposting, and forwarding MUST be distinct states or actions.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-007
  status: draft
- id: AWG-REQ-INV-008
  title: 'History is append-preserving'
  statement: 'Corrections, retractions, reversals, and updated beliefs MUST create new records or events. Causal history MUST NOT be silently erased.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-008
  status: draft
- id: AWG-REQ-INV-009
  title: 'State transitions are observable'
  statement: 'Important accepted commands and domain transitions MUST emit versioned machine-readable events to the world firehose.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-009
  status: draft
- id: AWG-REQ-INV-010
  title: 'Randomness is reproducible'
  statement: 'Stochastic behaviour MUST use named random streams or seeds and MUST be recorded sufficiently for experiment comparison and replay.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-010
  status: draft
- id: AWG-REQ-INV-011
  title: 'Simulation and visualization fidelity are independent'
  statement: 'Rendering an individual marker MUST NOT imply full cognition. Aggregating an individual into a map cluster MUST NOT remove their authoritative state.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-011
  status: draft
- id: AWG-REQ-INV-012
  title: 'Aggregates are not fake individuals'
  statement: 'When promoting cohorts to individuals, generated detail MUST be marked synthetic or instantiated and constrained by aggregate history; it MUST NOT be presented as previously observed personal history.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-012
  status: draft
- id: AWG-REQ-INV-013
  title: 'Scenario controllers cannot secretly force conclusions'
  statement: 'Interventions MUST change declared world conditions. Agents MUST react according to their own state, information, constraints, and decision systems.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-013
  status: draft
- id: AWG-REQ-INV-014
  title: 'Plugins cannot bypass the constitution'
  statement: 'Every adapter MUST preserve validation, provenance, eventing, access, and safety boundaries.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-014
  status: draft
- id: AWG-REQ-INV-015
  title: 'Provider changes are experiment-visible'
  statement: 'Model, provider, version, prompt-policy, and fallback changes MUST be recorded and MUST NOT silently alter a controlled run.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-015
  status: draft
- id: AWG-REQ-INV-016
  title: 'Authoritative geography is not reconstructed from display tiles'
  statement: 'PMTiles or Protomaps MAY present offline maps but MUST NOT replace OSM, PostGIS, or routing topology as simulation authority.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-016
  status: draft
- id: AWG-REQ-INV-017
  title: 'Human realism claims require evidence'
  statement: 'Believable output, LLM judge scores, or visual plausibility alone MUST NOT be treated as sufficient validation.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-017
  status: draft
- id: AWG-REQ-INV-018
  title: 'Data provenance is explicit'
  statement: 'Observed, imported, inferred, statistically sampled, scenario-assumed, and AI-generated data MUST be distinguishable.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-018
  status: draft
- id: AWG-REQ-INV-019
  title: 'Trust is contextual'
  statement: 'Trust MUST be evaluated in context such as source, domain, channel, situation, and history rather than a universal number alone.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-019
  status: draft
- id: AWG-REQ-INV-020
  title: 'Core operation can degrade safely without AI'
  statement: 'Loss or failure of an AI provider MUST NOT corrupt authoritative simulation state. Systems MUST fail closed, use deterministic fallback where specified, or leave agents inactive or deferred.'
  source_documents:
  - AWG-GOV-001
  implemented_by:
  - AWG-GOV-001
  verified_by:
  - AWG-TEST-INV-020
  status: draft
- id: AWG-REQ-MVP1-001
  title: 'The bounded district uses complete local spatial assets'
  statement: 'The MVP 1 reference scenario MUST package checksummed generated OSM, a PostGIS spatial model, a local gazetteer, a local routing graph, and a PMTiles presentation archive with explicit provenance.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-002
  - AWG-PLAT-006
  implemented_by:
  - AWG-DOM-002
  - AWG-PLAT-006
  verified_by:
  - AWG-TEST-MVP1-001
  status: draft
- id: AWG-REQ-MVP1-002
  title: 'Journeys cannot teleport and must obey routes and elapsed time'
  statement: 'The MVP 1 kernel MUST reject teleportation and inaccessible modes, MUST use authoritative route topology, and MUST leave an agent at its origin until computed travel time has elapsed.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-002
  - AWG-DOM-008
  implemented_by:
  - AWG-DOM-002
  - AWG-DOM-008
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP1-002
  status: draft
- id: AWG-REQ-MVP1-003
  title: 'Building entry uses valid entrances and capacity'
  statement: 'The MVP 1 kernel MUST terminate a building route at a declared entrance and MUST keep building and smart-object occupancy within capacity.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-002
  - AWG-DOM-010
  implemented_by:
  - AWG-DOM-002
  - AWG-DOM-010
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP1-003
  status: draft
- id: AWG-REQ-MVP1-004
  title: 'Immutable firehose replay reproduces world state'
  statement: 'The MVP 1 event firehose MUST be append-only, snapshots MUST contain integrity checksums, and deterministic replay MUST reproduce the authoritative state checksum.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-002
  - AWG-PLAT-007
  implemented_by:
  - AWG-PLAT-002
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP1-004
  status: draft
- id: AWG-REQ-MVP1-005
  title: 'Map and occupancy projections cannot mutate world state'
  statement: 'Semantic clustering and building occupancy inspection MUST operate as deterministic read projections and MUST NOT change authoritative agent positions or state checksums.'
  source_documents:
  - AWG-OPS-001
  - AWG-UX-002
  - AWG-UX-009
  implemented_by:
  - AWG-UX-002
  - AWG-UX-009
  verified_by:
  - AWG-TEST-MVP1-005
  status: draft
- id: AWG-REQ-MVP1-006
  title: 'The reference scenario operates offline'
  statement: 'The MVP 1 reference scenario MUST complete with no external network dependency and MUST validate every packaged spatial asset against its recorded checksum.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-006
  implemented_by:
  - AWG-PLAT-006
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP1-006
  status: draft
- id: AWG-REQ-MVP1-007
  title: 'The 24-hour target population run preserves integrity'
  statement: 'The MVP 1 acceptance profile MUST simulate 100 scheduled agents for 24 hours and complete 200 journeys and 1,400 domain events with zero state-integrity failures within the declared test budget.'
  source_documents:
  - AWG-OPS-001
  - AWG-OPS-002
  - AWG-OPS-003
  implemented_by:
  - AWG-OPS-001
  - AWG-OPS-002
  - AWG-OPS-003
  verified_by:
  - AWG-TEST-MVP1-007
  status: draft
- id: AWG-REQ-MVP2-001
  title: 'Agents produce coherent daily activity without LLM calls'
  statement: 'The MVP 2 classical NPC kernel MUST produce 24-hour home and work activity from needs, utility, schedules, and planners without importing or calling an LLM.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-003
  - AWG-DOM-011
  implemented_by:
  - AWG-DOM-003
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP2-001
  status: draft
- id: AWG-REQ-MVP2-002
  title: 'Impossible concurrent actions are blocked'
  statement: 'The MVP 2 kernel MUST occupy explicit action channels and MUST reject combinations such as sleep with travel or eat with work.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-003
  implemented_by:
  - AWG-DOM-003
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP2-002
  status: draft
- id: AWG-REQ-MVP2-003
  title: 'Resources and unique ownership are conserved'
  statement: 'Token and meal totals MUST be conserved across transfers, unique assets MUST have one owner, exclusive smart-object slots MUST NOT be double-reserved, and inventories MUST NOT go negative.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-006
  - AWG-DOM-010
  implemented_by:
  - AWG-DOM-006
  - AWG-DOM-010
  verified_by:
  - AWG-TEST-MVP2-003
  status: draft
- id: AWG-REQ-MVP2-004
  title: 'Perception cannot leak global world state'
  statement: 'An agent MUST know an event only as actor or via a valid co-located observation path and MUST NOT receive organization inventories or remote location changes automatically.'
  source_documents:
  - AWG-OPS-001
  - AWG-DOM-009
  - AWG-GOV-001
  implemented_by:
  - AWG-DOM-009
  - AWG-PLAT-007
  verified_by:
  - AWG-TEST-MVP2-004
  status: draft
- id: AWG-REQ-MVP3-001
  title: 'AI provider adapters preserve domain schemas'
  statement: 'Ollama and OpenRouter candidates MUST implement one provider-neutral AIProviderAdapter boundary, and switching provider MUST NOT change domain proposal schemas.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-003
  implemented_by:
  - AWG-PLAT-003
  verified_by:
  - AWG-TEST-MVP3-001
  status: draft
- id: AWG-REQ-MVP3-002
  title: 'Invalid model output fails closed'
  statement: 'Malformed, timed-out, schema-invalid, or provider-error model output MUST NOT mutate WorldState, EventLog, occupancy, claims, or live memory.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-003
  - AWG-GOV-001
  implemented_by:
  - AWG-PLAT-003
  - AWG-PLAT-002
  verified_by:
  - AWG-TEST-MVP3-002
  status: draft
- id: AWG-REQ-MVP3-003
  title: 'Recorded model output replays offline'
  statement: 'Every accepted adapter output MUST be recordable and replayable into the same typed proposal without a provider call.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-003
  - AWG-PLAT-002
  implemented_by:
  - AWG-PLAT-003
  - AWG-PLAT-002
  verified_by:
  - AWG-TEST-MVP3-003
  status: draft
- id: AWG-REQ-MVP3-004
  title: 'Model output provenance is complete'
  statement: 'Every adapter output artifact MUST record adapter, provider, model, prompt-policy, interface, and output-schema versions plus request correlation and outcome.'
  source_documents:
  - AWG-OPS-001
  - AWG-PLAT-003
  implemented_by:
  - AWG-PLAT-003
  verified_by:
  - AWG-TEST-MVP3-004
  status: draft
- id: AWG-REQ-MVP4-001
  title: 'Provenance chains are reconstructable'
  statement: 'An observation-to-message-to-post-to-repost chain MUST be reconstructable from parent event identifiers without deleting prior transmissions.'
